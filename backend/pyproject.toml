[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qualcoder-api"
version = "0.1.0"
description = "QualCoder v4 backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "diff-match-patch>=20241021",
    "emoji>=2.10",
    "Pillow>=10.0",
    "rispy>=0.10",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qualcoder_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "ASYNC",
    "C4", "SIM", "RET", "PIE", "RUF", "PERF", "PT",
]
ignore = [
    "E501",
    # Desktop app: single local client, tiny local FS probes in the event
    # loop are acceptable; anyio/trio path wrappers would add no value.
    "ASYNC240",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["src"]
