[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qualcoder-api"
version = "0.1.6"
description = "QualCoder v4 backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    # Prod-only uvicorn deps (the [standard] extra also pulls watchfiles for
    # --reload, which the packaged app never uses; uvloop is non-Windows).
    "uvicorn>=0.30",
    "httptools>=0.8.0",
    "python-dotenv>=0.13",
    "pyyaml>=5.1",
    "websockets>=13.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "diff-match-patch>=20241021",
    "emoji>=2.10",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "rispy>=0.10",
    "faster-whisper>=1.1",
    "openpyxl>=3.1",
    "pyreadstat>=1.3",  # SPSS .sav reads use output_format="dict" (no pandas)
    "vaderSentiment>=3.3",
    "yt-dlp>=2025.4",
    "trafilatura>=1.8",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "mcp>=1.2,<2",
    # Server mode (SERVER_PLAN.md) — imported only when QC_SERVER_MODE is on
    "argon2-cffi>=23.1",
    "webauthn>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6",
    # Test-only: .sav fixtures are written via pyreadstat.write_sav, which
    # needs a pandas (or polars) DataFrame. Production reads use dict mode.
    "pandas>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qualcoder_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "ASYNC",
    "C4", "SIM", "RET", "PIE", "RUF", "PERF", "PT",
]
ignore = [
    "E501",
    # Desktop app: single local client, tiny local FS probes in the event
    # loop are acceptable; anyio/trio path wrappers would add no value.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F841", "PT011", "PT012", "PT018", "SIM222", "UP031"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["src"]
