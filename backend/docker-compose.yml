# QualCoder server stack (SERVER_PLAN.md §10.2).
#
#   cp .env.example .env      # fill in secrets
#   docker compose up -d
#
# The optional `caddy` service terminates TLS, serves the built frontend
# (mount ../frontend/dist at /srv/www) and proxies /api to the backend.
# The optional `cloud-backup` profile runs the rclone mirror (Phase 4).

services:
  qualcoder:
    build: .
    image: qualcodernext-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QC_SERVER_MODE: "true"
      QC_DATA_DIR: /data/qualcoder
    volumes:
      - data:/data/qualcoder
      - logs:/var/log/qualcoder
    # No direct host port: TLS termination happens in `caddy` (80/443).
    # Expose 8765 directly only for local debugging via:
    #   docker compose up qualcoder -p 127.0.0.1:8765:8765
    expose:
      - "8765"

  caddy:
    image: caddy:2.8.4
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - qualcoder
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config

  cloud-backup:
    image: python:3.11.12-slim-bookworm
    profiles: ["cloud"]
    restart: unless-stopped
    depends_on:
      - qualcoder
    volumes:
      - data:/data/qualcoder:ro
      - ./scripts/cloud-backup.sh:/usr/local/bin/cloud-backup.sh:ro
      - rclone_conf:/config/rclone
    environment:
      QC_BACKUP_RETENTION: ${QC_BACKUP_RETENTION:-daily=14,weekly=8,monthly=12}
      RCLONE_REMOTE: ${QC_RCLONE_REMOTE:-qcnext-crypt:}
    # Do not run as root and do not apt-get on every start: rclone is baked
    # into the server image; this sidecar reuses it via a shared volume in
    # production. The inline install below is a dev fallback only.
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c", "while true; do /usr/local/bin/cloud-backup.sh; sleep 21600; done"]

volumes:
  data:
  logs:
  caddy_data:
  caddy_config:
  rclone_conf:
