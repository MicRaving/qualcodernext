# Flatpak wrapper for QCnext (Tauri 2).
#
# The stock Tauri CLI cannot emit .flatpak bundles, so the release pipeline
# builds the regular .deb first (see release.yml / scripts/build-flatpak.sh)
# and THIS manifest repackages it into a self-contained single-file .flatpak.
#
# Runtime: org.gnome.Platform ships WebKitGTK (webkit2gtk-4.1), which the Tauri
# WebView needs (the freedesktop runtime would require an extra WebKit2Gtk
# extension). Stay on the NEWEST stable branch: a branch is EOL-ed roughly a
# year after release, and `flatpak` warns on every operation once it is.
# (GNOME 48 went EOL 2026-03-24 -> the runtime dropped to 51.)
#
# App id: deliberately NOT `org.qcnext.desktop`. Flatpak/AppStream treat ids
# ending in `.desktop` as a legacy special case, and a desktop entry must be
# named exactly `<app-id>.desktop` — with such an id that becomes the confusing
# `org.qcnext.desktop.desktop`. The Tauri bundle identifier is unaffected.
#
# Note: because the app ships prebuilt binaries instead of building from
# source inside the sandbox, this manifest is suitable for direct
# distribution (GitHub releases, `flatpak install ./file.flatpak`) but NOT
# for a Flathub submission — Flathub requires building everything from
# declared sources.
#
# Regenerate the bundle:
#   flatpak-builder --force-clean --user --repo=repo builddir org.qcnext.QCnext.yml
#   flatpak build-bundle --user repo QCnext.flatpak org.qcnext.QCnext

app-id: org.qcnext.QCnext
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: qcnext
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # AI providers, URL scraping and the updater fetch over HTTPS.
  - --share=network
  # Projects live anywhere under the user's home.
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  # WebKitGPU compositing crashes inside some sandboxes; the flag is the
  # standard workaround for Tauri/WebKitGTK flatpaks.
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
modules:
  - name: qcnext
    buildsystem: simple
    build-commands:
      # Extract ALL deb members — the data archive's compression has changed
      # across tauri-bundler versions (xz → zstd), so don't hardcode names.
      - ar x qcnext.deb
      - rm -f debian-binary control.tar.*
      # tar auto-detects the compression from the file's magic bytes.
      - tar -xf data.tar.*
      # The deb lays out under ./usr — flatten into the /app prefix. Paths
      # stay valid because the Tauri binary resolves its resources relative
      # to itself (/app/bin -> /app/lib/qcnext).
      - cp -a usr/. /app/
      - rm -rf usr
      - chmod +x /app/bin/*
      # Flatpak only exports a desktop entry named EXACTLY <app-id>.desktop,
      # and icons named after the app id. Tauri names both after the product,
      # so without this rename the app installs and runs but never appears in
      # the host's app list (and has no icon).
      - |
        set -e
        appid=org.qcnext.QCnext
        entry="/app/share/applications/$appid.desktop"
        mv /app/share/applications/*.desktop "$entry"
        desktop-file-edit --set-key=Exec --set-value=qcnext "$entry"
        desktop-file-edit --set-key=Icon --set-value="$appid" "$entry"
        find /app/share/icons/hicolor -type f -path '*/apps/*' | while read -r icon; do
          ext="${icon##*.}"
          mv "$icon" "$(dirname "$icon")/$appid.$ext"
        done
    sources:
      - type: file
        path: qcnext.deb
