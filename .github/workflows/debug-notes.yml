name: Debug release-notes extraction
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Replicate extraction step
        shell: pwsh
        working-directory: frontend
        run: |
          $version = "${{ inputs.version }}" -replace '^v', ''
          Write-Host "version=[$version]"
          Write-Host "Test-Path ../../CHANGELOG.md = $(Test-Path '../../CHANGELOG.md')"
          if (Test-Path "../../CHANGELOG.md") {
            $lines = Get-Content "../../CHANGELOG.md"
            Write-Host "lines.Count = $($lines.Count)"
            Write-Host "first line = [$($lines[0])]"
            Write-Host "line 7 = [$($lines[6])]"
            $pattern = '^##\s+v?' + [regex]::Escape($version) + '(\s|\(|$)'
            Write-Host "pattern = [$pattern]"
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $pattern) { $start = $i; Write-Host "MATCH at $i"; break }
              else { Write-Host "no-match line $($i): [$($lines[$i])]" }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match '^##\s') { $end = $j; break }
              }
              $body = ($lines[$start..($end - 1)] -join "`n").Trim()
              Write-Host "BODY LEN $($body.Length): $($body.Substring(0, [Math]::Min(120, $body.Length)))"
            } else { Write-Host "NO MATCH FOUND" }
          }
