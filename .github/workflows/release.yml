name: Release

# Builds the release for Windows and macOS (Tauri cannot
# cross-compile — every platform builds on its own runner), signs the updater
# artifacts with the repo's TAURI_SIGNING_PRIVATE_KEY secret, publishes the
# installers to a GitHub release and assembles the static update manifest the
# app's updater endpoint points at
# (https://github.com/MicRaving/QCnext/releases/latest/download/qcnext-latest.json).
#
# Required repository secret: TAURI_SIGNING_PRIVATE_KEY — the content of
# updater.key (the app's built-in pubkey lives in tauri.conf.json and must
# belong to this key, see `npx tauri signer generate`). When the secret is
# ABSENT the build degrades gracefully to UNSIGNED installers (updater
# artifacts disabled, no update manifest) so the pipeline never fails at the
# signing step — the "A public key has been found, but no private key" error.
#
# Only the NSIS setup .exe is uploaded for Windows (NOT the MSI).
#
# Linux ships as a single-file .flatpak: the stock Tauri v2 CLI cannot emit
# flatpak bundles (`--bundles` only accepts deb/rpm/appimage on Linux), so the
# pipeline builds the .deb and wraps it via flatpak-builder with the checked-in
# manifest frontend/src-tauri/packaging/flatpak/org.qcnext.desktop.yml. Only
# the .flatpak is uploaded (the .deb is an intermediate artifact).
#
# macOS x86_64 uses the macos-15-intel label — the macos-13 image was retired
# by GitHub on 2025-12-04 and jobs pinned to it queue forever.
#
# Note: macOS builds are unsigned (no Apple code-signing secrets); Gatekeeper
# will warn on first launch until a certificate + notarization are configured.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0). Omit to release the version already set in frontend/src-tauri/tauri.conf.json."
        required: false
        type: string

# How to cut a release: Actions → Release → Run workflow.
#
# A workflow_dispatch run does NOT build anything — the lightweight `tag` job
# resolves the version (input or tauri.conf.json), patches + commits it when
# the input differs, pushes the vX.Y.Z tag and stops. The tag push then
# triggers this same workflow in tag context, which runs the real matrix
# build and publishes to GitHub Releases with the tag as target.
#
# Release notes: the body is taken from the `## vX.Y.Z …` section of
# CHANGELOG.md when one exists (everything from that heading up to the next
# `## ` heading); auto-generated commit notes are appended regardless.

permissions:
  # Pushing the version-bump commit + tag, and creating the GitHub release.
  contents: write
  # Triggering the build via the workflow-dispatch API after cutting the tag.
  actions: write

jobs:
  tag:
    name: Cut release tag
    # Only branch dispatches cut tags — the tag-ref dispatch this job
    # triggers below must NOT recurse into cutting again.
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version (input wins over tauri.conf.json)
        id: version
        run: |
          CONF_VERSION="$(jq -r .version frontend/src-tauri/tauri.conf.json)"
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION:-$CONF_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "conf_version=$CONF_VERSION" >> "$GITHUB_OUTPUT"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::Invalid version '$VERSION' — expected e.g. 0.3.0"
            exit 1
          fi

      - name: Refuse to re-cut an existing tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "::error::Tag $TAG already exists — bump the version."
            exit 1
          fi

      - name: Patch tauri.conf.json when the input version differs
        if: steps.version.outputs.version != steps.version.outputs.conf_version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            frontend/src-tauri/tauri.conf.json > tmp.conf.json
          mv tmp.conf.json frontend/src-tauri/tauri.conf.json

      - name: Commit the version bump and push the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet frontend/src-tauri/tauri.conf.json; then
            git add frontend/src-tauri/tauri.conf.json
            git commit -m "chore(release): v$VERSION"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          # A GITHUB_TOKEN git-push never triggers workflows (anti-recursion),
          # so start the build explicitly via a workflow_dispatch on the tag
          # ref — API-created dispatches DO run (documented exception).
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"v$VERSION\"}"

  build:
    name: Build ${{ matrix.target }}
    # Only tag-context runs build+publish; workflow_dispatch runs are handled
    # entirely by the `tag` job above.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
            release_files: |
              frontend/src-tauri/target/release/qcnext.exe
              frontend/src-tauri/target/release/bundle/nsis/*setup.exe
              frontend/src-tauri/target/release/bundle/nsis/*setup.exe.sig
          - os: macos-15-intel
            target: darwin-x86_64
            bundles: app,dmg
            release_files: |
              frontend/src-tauri/target/release/bundle/macos/*.tar.gz
              frontend/src-tauri/target/release/bundle/macos/*.dmg
              frontend/src-tauri/target/release/bundle/macos/*.sig
          - os: macos-latest
            target: darwin-aarch64
            bundles: app,dmg
            release_files: |
              frontend/src-tauri/target/release/bundle/macos/*.tar.gz
              frontend/src-tauri/target/release/bundle/macos/*.dmg
              frontend/src-tauri/target/release/bundle/macos/*.sig
          - os: ubuntu-22.04
            target: linux-x86_64
            # The stock Tauri CLI cannot emit flatpak bundles; build the deb
            # and wrap it into a .flatpak via flatpak-builder (see the step
            # below + packaging/flatpak/org.qcnext.desktop.yml). Only the
            # .flatpak ships.
            bundles: deb
            release_files: |
              frontend/src-tauri/target/release/bundle/flatpak/*.flatpak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies (webkit2gtk, tray, svg, flatpak-builder)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder

      - name: Backend deps (incl. PyInstaller for the onedir)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Frontend deps
        run: npm ci

      - name: Restore the signing key (or degrade to unsigned builds)
        shell: pwsh
        run: |
          # Tauri reads the private key from TAURI_SIGNING_PRIVATE_KEY
          # ("path or content"); a *_PATH variable is ignored. Use forward
          # slashes so the path also resolves on macOS/Linux runners.
          $keyPath = "$env:RUNNER_TEMP/updater.key"
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}") {
            Set-Content -Path $keyPath -Value "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -NoNewline
            "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Signing key restored - updater artifacts will be created."
          } else {
            # No private key: tauri would fail with "A public key has been
            # found, but no private key". Disable updater artifacts so the
            # build completes with unsigned installers.
            $conf = Get-Content "src-tauri/tauri.conf.json" -Raw
            $patched = $conf -replace '"createUpdaterArtifacts"\s*:\s*true', '"createUpdaterArtifacts": false'
            Set-Content "src-tauri/tauri.conf.json" $patched -Encoding utf8 -NoNewline
            "UNSIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "TAURI_SIGNING_PRIVATE_KEY secret missing - building UNSIGNED (updater artifacts disabled)."
          }

      - name: Build backend onedir (PyInstaller)
        working-directory: backend
        run: python -m PyInstaller --noconfirm qualcoder_backend.spec

      - name: Copy backend into Tauri resources
        shell: pwsh
        run: |
          $target = "src-tauri/resources/backend"
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item "../backend/dist/qualcoder-backend/*" $target -Recurse -Force

      - name: Build the Tauri app (signed or unsigned)
        working-directory: frontend/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Wrap the .deb into a .flatpak (Linux)
        if: runner.os == 'Linux'
        working-directory: frontend/src-tauri
        shell: pwsh
        run: |
          $deb = Get-ChildItem "target/release/bundle/deb/*.deb" | Select-Object -First 1
          if (-not $deb) { throw "No .deb produced by the tauri build" }
          $stage = "target/release/bundle/flatpak-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $deb.FullName "$stage/qcnext.deb"
          Copy-Item "packaging/flatpak/org.qcnext.desktop.yml" $stage

          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --assumeyes --user --noninteractive flathub org.gnome.Sdk//48 org.gnome.Platform//48

          Push-Location $stage
          flatpak-builder --force-clean --user --repo=repo builddir org.qcnext.desktop.yml
          $version = ("$env:GITHUB_REF_NAME") -replace '^v', ''
          New-Item -ItemType Directory -Force "../flatpak" | Out-Null
          flatpak build-bundle repo "../flatpak/QCnext_$version.flatpak" org.qcnext.desktop
          Pop-Location
          Get-ChildItem "target/release/bundle/flatpak"

      - name: Rename macOS updater bundles (unique asset names per arch)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/macos"
          if (-not (Test-Path $dir)) {
            if ("$env:UNSIGNED_BUILD" -eq "true") {
              Write-Host "Unsigned build produced no updater bundles - nothing to rename."
              exit 0
            }
            throw "Missing bundle directory: $dir"
          }
          $suffix = "${{ matrix.target }}".Replace("darwin-", "")
          $base = Get-ChildItem $dir -Filter "*.app.tar.gz" | Select-Object -First 1
          if (-not $base) {
            if ("$env:UNSIGNED_BUILD" -eq "true") {
              Write-Host "Unsigned build produced no .app.tar.gz - nothing to rename."
              exit 0
            }
            throw "No .app.tar.gz updater bundle found in $dir"
          }
          $renamed = "QCnext_darwin_$suffix.app.tar.gz"
          Move-Item "$dir/$($base.Name)" "$dir/$renamed"
          Move-Item "$dir/$($base.Name).sig" "$dir/$renamed.sig"

      - name: Build the update-manifest fragment
        if: env.UNSIGNED_BUILD != 'true'
        shell: pwsh
        working-directory: frontend/src-tauri/target/release/bundle
        run: |
          if (-not (Test-Path ".")) { throw "Missing bundle directory: $PWD" }
          switch ("${{ matrix.target }}") {
            "windows-x86_64" { $dir = "nsis";  $glob = "*setup.exe" }
            "darwin-x86_64"  { $dir = "macos"; $glob = "QCnext_darwin_x86_64.app.tar.gz" }
            "darwin-aarch64" { $dir = "macos"; $glob = "QCnext_darwin_aarch64.app.tar.gz" }
            default          { throw "No updater bundle mapping for ${{ matrix.target }}" }
          }
          $file = Get-ChildItem $dir -Filter $glob | Select-Object -First 1
          if (-not $file) { throw "No updater bundle matched $glob in $dir" }
          $signature = (Get-Content "$($file.FullName).sig" -Raw).Trim()
          if (-not $signature) { throw "Missing .sig for $($file.Name)" }
          $fragment = @{
            target    = "${{ matrix.target }}"
            signature = $signature
            url       = "https://github.com/MicRaving/QCnext/releases/latest/download/$($file.Name)"
          }
          $fragment | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/fragment-${{ matrix.target }}.json"

      - name: Upload manifest fragment
        if: env.UNSIGNED_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.target }}
          path: ${{ runner.temp }}/fragment-${{ matrix.target }}.json

      - name: Release body from CHANGELOG.md
        shell: pwsh
        run: |
          # Use the `## vX.Y.Z …` section of CHANGELOG.md as the release
          # body when present (up to the next `## ` heading); otherwise an
          # empty body — generate_release_notes appends commit notes anyway.
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          $body = ""
          if (Test-Path "../../CHANGELOG.md") {
            $lines = Get-Content "../../CHANGELOG.md"
            $pattern = '^##\s+v?' + [regex]::Escape($version) + '(\\s|\\(|$)'
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $pattern) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match '^##\s') { $end = $j; break }
              }
              $body = ($lines[$start..($end - 1)] -join "`n").Trim()
            }
          }
          Set-Content -Path "release-body.md" -Value $body -Encoding utf8 -NoNewline
          Write-Host "Release body: $($body.Length) characters extracted for v$version"

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: frontend/release-body.md
          generate_release_notes: true
          files: ${{ matrix.release_files }}

  manifest:
    name: Assemble qcnext-latest.json
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble the static update manifest
        shell: pwsh
        run: |
          $fragments = Get-ChildItem "fragments/fragment-*.json" -ErrorAction SilentlyContinue
          if (-not $fragments) {
            Write-Host "No signed updater fragments (unsigned build) - skipping the update manifest."
            exit 0
          }
          $version = (Get-Content "frontend/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $platforms = @{}
          foreach ($f in $fragments) {
            $frag = Get-Content $f.FullName -Raw | ConvertFrom-Json
            $platforms[$frag.target] = @{
              signature = $frag.signature
              url       = $frag.url
            }
          }
          $manifest = @{
            version   = $version
            notes     = "QualCoder v$version"
            pub_date  = (Get-Date).ToUniversalTime().ToString("o")
            platforms = $platforms
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "qcnext-latest.json" -Encoding utf8

      - name: Upload the update manifest
        if: hashFiles('qcnext-latest.json') != '' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: qcnext-latest.json
